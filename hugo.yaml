baseURL: https://hongkian03.github.io/personal_website/
title: Kian Hong Tan
languageCode: en-US
theme: hugo-flex
enableRobotsTXT: true

params:
  description: "Developer, researcher-in-training, and writer."
  color: "#1f5f5b"
  width: 48rem
  divider: "\\2500\\2500"
  footer: "© Kian Hong Tan. Built with Hugo."
  rss: "Subscribe to new blog posts with your preferred feed reader."
  favicon: false
  noClasses: false
  headingoffset: 0
  linkicons: hover
  summaries: true
  schema: false
  opengraph: true
  twittercards: true
  mainSections:
    - blog
  css:
    - css/site.css

menu:
  main:
    - name: About
      pageRef: /about
      weight: 1
    - name: Projects
      pageRef: /projects
      weight: 2
    - name: Experience
      pageRef: /experience
      weight: 3
    - name: Blog
      pageRef: /blog
      weight: 4
    - name: RSS
      pageRef: /
      weight: 5
      params:
        format: rss

taxonomies: {}

outputFormats:
  rss:
    mediaType: application/rss+xml
    baseName: feed

pagination:
  pagerSize: 10
