{{ define "main" }}

  <article>
    <header class="Detail-header">
      {{ $context := dict "page" . "level" 1 "isdateshown" true }}
      {{ partial "heading.html" $context }}
    </header>

    <div class="Prose">
      {{ .Content }}
    </div>

    <a class="Detail-back" href="{{ relref . "/blog" }}">All posts</a>
  </article>

{{ end }}
